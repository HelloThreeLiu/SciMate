[package]
name = "scimate-spike"
version = "0.1.0"
description = "SciMate 阶段零打包可行性验证 Spike：Tauri 外壳 + Python sidecar 内核"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
